name: UEFI Build & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-build:
    name: Clippy, Host Tests & UEFI Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain + UEFI Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi,x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Run Clippy Linter (Default Features)
        run: cargo clippy --target x86_64-unknown-uefi -- -D warnings

      - name: Run Clippy Linter (All Features: headless, spoof-disk, spoof-mac, agentic)
        run: cargo clippy --target x86_64-unknown-uefi --features "headless,spoof-disk,spoof-mac,agentic" -- -D warnings

      - name: Run Host Unit & Integration Tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Test status profile validation
        shell: powershell
        run: ./tests/status-profile.Tests.ps1

      - name: Test storage property diagnostic
        run: cargo test --locked --manifest-path tools/storage-query/Cargo.toml --target x86_64-pc-windows-msvc --target-dir target

      - name: Build storage property diagnostic
        run: cargo build --locked --manifest-path tools/storage-query/Cargo.toml --target x86_64-pc-windows-msvc --target-dir target

      - name: Build UEFI Release Binary (GOP GUI Mode)
        run: cargo build --release --target x86_64-unknown-uefi

      - name: Validate PowerShell installer syntax
        shell: powershell
        run: .\\tools\\test-installer-syntax.ps1

      - name: Unit test standalone WDM diagnostic and patch modules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("attachment", "spaceport_candidate", "spaceport_serial_patch", "namespace_id_patch")) {
            $path = "driver/src/$name.rs"
            $exe = "$env:TEMP/$name-ci-tests.exe"
            rustc --edition=2024 --test $path -o $exe
            if ($LASTEXITCODE -ne 0) { throw "Failed to compile $name tests" }
            & $exe
            if ($LASTEXITCODE -ne 0) { throw "Failed to run $name tests" }
          }

      - name: Lint experimental Spaceport Windows driver feature
        run: cargo clippy --manifest-path driver/Cargo.toml --target x86_64-pc-windows-msvc --features spaceport-serial-patch,namespace-id-patch -- -D warnings

      - name: Build Windows Kernel WDM Disk Filter Driver (.sys, Spaceport feature)
        run: cargo build --release --manifest-path driver/Cargo.toml --target x86_64-pc-windows-msvc --features spaceport-serial-patch,namespace-id-patch

      - name: Upload smbios-spoofer.efi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smbios-spoofer-efi
          path: target/x86_64-unknown-uefi/release/smbios-spoofer.efi
