[package]
name = "smbios-disk-filter"
version = "0.2.0"
edition = "2024"
description = "Windows Kernel WDM Storage Filter Driver (Ring 0) for NVMe/SATA/SCSI Disk Serial Spoofing"
autobins = false
autolib = false

[[bin]]
name = "smbios-disk-filter"
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = false

[features]
attachment-diagnostics = []
# Experimental; only for the observed Micron 2400 response with exact old string.
spaceport-serial-patch = ["attachment-diagnostics"]

# Optional exact-match Micron StorageDeviceIdProperty/DUID SCSI-name-string alias.
# Does NOT rewrite actual NVMe EUI-64/NGUID or Spaceport UniqueId.
namespace-id-patch = []
